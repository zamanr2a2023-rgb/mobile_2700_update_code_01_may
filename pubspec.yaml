name: truckfix
description: TruckFix mobile — fleet & mechanic marketplace.
publish_to: 'none'
version: 1.0.0+9

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  go_router: ^14.6.2
  http: ^1.4.0
  shared_preferences: ^2.5.3
  geolocator: ^14.0.2
  google_maps_flutter: ^2.17.0
  image_picker: ^1.2.2
  permission_handler: ^12.0.1
  http_parser: ^4.1.2
  url_launcher: ^6.3.1
  firebase_core: ^4.9.0
  firebase_messaging: ^16.2.2
  flutter_local_notifications: ^18.0.1
  flutter_stripe: ^12.6.0
  app_links: ^6.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assetis/LOGO.png
  web:
    generate: true
  windows:
    generate: true
  macos:
    generate: true

flutter:
  uses-material-design: true
  assets:
    - assetis/LOGO.png
